name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    # Pinned: ubuntu-latest moved to Ubuntu 26.04, where Playwright 1.60 cannot install
    # Chromium ("Playwright does not support chromium on ubuntu26.04-x64").
    # Move to a newer image together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The build reads the last content change date from git history
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run playwright:smoke

      # Offline mode, metadata and regressions against the production build above
      - name: Production tests
        run: npm run test:prod

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .work/playwright-report
            .work/playwright-prod-report
          retention-days: 7
