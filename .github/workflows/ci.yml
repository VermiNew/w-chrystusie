name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The build reads the last content change date from git history
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # >= 22.18 is required: the SEO generator imports TypeScript files directly
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run playwright:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .work/playwright-report
          retention-days: 7
